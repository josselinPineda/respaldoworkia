name: workia
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.4

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Allows launching URLs, for example to open a location in
  # the default maps application from the mini map widget.
  url_launcher: ^6.3.2
  
  http: ^1.2.0

  # Charting library used to display income vs expense charts in the
  # balance report.  Add this package to your pubspec so the pie
  # chart in BalancePage renders correctly.
  fl_chart: ^1.1.1

  # Añadimos provider para la gestión de estado e inyección de dependencias
  provider: ^6.1.5+1

  # Añadimos go_router para implementar una navegación declarativa
  go_router: ^16.3.0

  # Firebase core y Firestore para integrar con la nube.
  #
  # Se actualizan a las versiones más recientes disponibles
  # (noviembre de 2025) para evitar errores como "PigeonUserDetails"
  # que ocurren con combinaciones de versiones antiguas【292427482596027†L1476-L1484】【156924727232643†L34-L41】.
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0

  # Para invocar funciones de Firebase que generan mensajes IA.
  # Mantenemos cloud_functions en la serie 6.x para garantizar
  # compatibilidad con firebase_auth ^6.1.2 y firebase_core ^4.2.1.
  cloud_functions: ^6.0.4

  # Autenticación de usuarios con Firebase.  Estos paquetes permiten
  # registrar y autenticar usuarios mediante correo y contraseña o
  # proveedores externos como Google.  Se actualizan para asegurar
  # compatibilidad con las versiones más recientes de firebase_core.
  firebase_auth: ^6.3.0
  # Mantenemos google_sign_in en la serie 6.x para conservar la API
  # `signIn()` y el constructor sin nombre.  La versión 7.x elimina
  # `signIn` y el constructor por defecto, provocando errores de compilación.
  google_sign_in: ^6.1.5

  # Formateo de fechas y horas usado por las funciones de IA.
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Dropdown search widget used for the advanced filter UI in the agenda panel.
  # Provides searchable drop‑downs and multi‑selection capabilities with
  # built‑in chip display for selected items.  See:
  # https://pub.dev/packages/dropdown_search
  dropdown_search: ^6.0.2

  # Geolocator se utiliza para obtener la ubicación actual del dispositivo
  # dentro del formulario de clientes.  Permite pedir permisos de
  # localización y recuperar la latitud y longitud actual para centrar
  # el mapa y mostrar el punto azul.  Se agrega como dependencia para
  # habilitar esta funcionalidad en la vista de cliente.
  geolocator: ^10.1.0

  # Geocoding permite convertir direcciones en coordenadas (lat/lng) sin usar
  # la API de Google Places.  Se utiliza en el formulario de cliente para
  # realizar búsqueda de ubicaciones y centrar el mapa en la dirección
  # seleccionada por el usuario dentro de un modal.  Al añadir esta
  # dependencia se requiere ejecutar `flutter pub get` antes de compilar.
  geocoding: ^2.1.0

  # Selector de rango de fechas para el formulario de trabajos.  Este paquete
  # ofrece un calendario personalizable con soporte para selección de rangos.
  calendar_date_picker2: ^2.0.1
  google_maps_flutter: ^2.14.0

  # Exportación de datos de balance en múltiples formatos
  path_provider: ^2.1.0      # Obtener directorios del sistema
  share_plus: ^7.0.0         # Compartir archivos
  csv: ^6.0.0                # Generar archivos CSV
  pdf: ^3.11.1               # Generar archivos PDF
  excel: ^4.0.6              # Generar archivos Excel (compatible con intl 0.20.2)
  permission_handler: ^11.3.1  # Manejar permisos de almacenamiento
  flutter_gen: ^5.10.0
  firebase_storage: ^13.1.0
  firebase_messaging: ^16.1.3
  firebase_analytics: ^12.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  build_runner: ^2.13.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.6

flutter_native_splash:
  color: "#F5F7FA"
  image: "assets/images/workia_logo.png"
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/workia_logo.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Register image assets used in the application.  The Workia
  # logo is displayed on the login page above the heading.
  assets:
    - assets/images/workia_logo.png

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
